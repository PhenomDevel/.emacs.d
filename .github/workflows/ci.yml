name: CI

on:
  push:
    branches: [claude/tmp-ci-diag]

jobs:
  startup:
    name: ${{ matrix.os }} / Emacs ${{ matrix.emacs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        emacs: ['29.4', '30.2', '31.1']
    steps:
      - uses: actions/checkout@v5

      - name: Install Emacs (Linux/macOS)
        if: runner.os != 'Windows'
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      # Official GNU build; jcs090218/setup-emacs-windows 404s on 31.1
      - name: Install Emacs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = '${{ matrix.emacs }}'
          $major = $v.Split('.')[0]
          Invoke-WebRequest "https://ftp.gnu.org/gnu/emacs/windows/emacs-$major/emacs-$v.zip" -OutFile "$env:RUNNER_TEMP\emacs.zip"
          Expand-Archive "$env:RUNNER_TEMP\emacs.zip" -DestinationPath C:\emacs
          $bin = (Get-ChildItem C:\emacs -Recurse -Filter emacs.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\emacs.exe" --version | Select-Object -First 1

      - name: First start (installs packages)
        shell: bash
        run: emacs --batch --init-directory="$GITHUB_WORKSPACE" -l test/check-startup.el

      - name: Second start (must be free of warnings and errors)
        shell: bash
        run: |
          emacs --batch --init-directory="$GITHUB_WORKSPACE" -l test/check-startup.el 2>&1 | tee startup.log
          if grep -E '(Warning|Error) \(|Cannot load|^Error' startup.log; then
            echo "::error::warnings or errors during startup"
            exit 1
          fi

